name: Offline compression
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools wheel pybind11 numpy
      - name: Build CPU offline extension
        working-directory: src/offline
        run: python setup.py build_ext --build-lib ../../build-lib
      - name: Test exact compression and dispatch
        env:
          PYTHONPATH: build-lib
        run: |
          python tests/test_offline_compression.py
          python tests/test_batch_compression.py
